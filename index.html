<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f6">
  <meta name="description" content="你送的，我都喜欢。一份从有价到无价的手链小礼物。">
  <title>你送的，我都喜欢。</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf9f6;
      --ink: #33312e;
      --muted: #9a9690;
      --line: #e6e2dc;
      --filled: #b6a99a;
      --knob: #797067;
      --progress: 0%;
      --serif: "Bodoni Moda", "Times New Roman", "Songti SC", "SimSun", serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 280px; min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 1.1s ease, color 1s ease;
    }
    body.priceless {
      color-scheme: dark;
      --paper: #0d0d0e;
      --ink: #f1ede6;
      --muted: #85817d;
      --line: #303031;
      --filled: #8b7d76;
      --knob: #d6c4b5;
    }
    button, input { font: inherit; -webkit-tap-highlight-color: transparent; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #bb8b7d; outline-offset: 7px; }
    button:disabled { cursor: default; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 91px;
      padding: 0 5.1%;
      position: relative;
      z-index: 2;
    }
    .wordmark {
      display: flex;
      align-items: center;
      gap: 11px;
      font-family: var(--serif);
      font-size: 14px;
      letter-spacing: 2.6px;
    }
    .wordmark svg { width: 15px; height: 15px; color: #b4a18c; }
    .play-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: transparent;
      min-width: 88px;
      min-height: 35px;
      padding: 8px 15px;
      font-size: 10px;
      letter-spacing: 1.1px;
      transition: border-color .3s, background .3s;
    }
    .play-button:hover { background: #b4a18c12; border-color: #b4a18c70; }
    .play-button svg { width: 10px; height: 10px; }
    main {
      min-height: calc(100svh - 159px);
      display: grid;
      place-items: center;
      padding: 22px 24px 35px;
    }
    .gift { width: min(100%, 420px); text-align: center; }
    .eyebrow {
      font-size: 9px;
      letter-spacing: 3.5px;
      font-weight: 400;
      color: var(--muted);
      margin: 0 0 12px;
      transition: color 1s;
    }
    .artwork {
      position: relative;
      width: min(100%, 355px);
      aspect-ratio: 1;
      margin: 0 auto;
      isolation: isolate;
      /* 轻微透视与移动由鼠标位置驱动，触屏保持稳定。 */
      --tilt-x: 0deg;
      --tilt-y: 0deg;
    }
    .bracelet {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(3px) scale(.985);
      transition: opacity .14s ease, transform .18s ease, visibility .14s;
      pointer-events: none;
    }
    .bracelet.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
    .bracelet svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      transform: perspective(700px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transition: transform .5s ease-out;
    }
    .details { min-height: 107px; margin-top: 19px; }
    body.scrubbing, body.scrubbing .bracelet { transition: none; }
    .price {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-size: 23px;
      font-weight: 400;
      letter-spacing: .8px;
      line-height: 1.2;
    }
    .name { margin: 0; font-size: 14px; font-weight: 400; letter-spacing: 2px; line-height: 1.8; }
    .description { margin: 7px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 1px; line-height: 1.8; }
    .priceless .price { font-style: italic; font-size: 28px; letter-spacing: 1px; }
    .priceless .name { letter-spacing: 3px; }
    .slider-group { width: min(100%, 360px); margin: 21px auto 0; }
    .progress-meta { display: flex; justify-content: space-between; margin: 0 5px 3px; color: var(--muted); font-size: 9px; letter-spacing: 1px; }
    .counter { font-variant-numeric: tabular-nums; }
    .slider-controls { display: flex; align-items: center; gap: 8px; }
    .step-button { flex: 0 0 36px; height: 48px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 22px; font-weight: 300; touch-action: manipulation; }
    .step-button:hover { color: var(--ink); }
    .step-button:disabled { opacity: .2; }
    .range-wrap { position: relative; min-width: 0; flex: 1; height: 52px; display: flex; align-items: center; }
    .range-wrap::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      height: 2px;
      background: linear-gradient(to right, var(--filled) 0%, var(--filled) var(--progress), var(--line) var(--progress), var(--line) 100%);
      pointer-events: none;
    }
    input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      height: 52px;
      margin: 0;
      background: transparent;
      cursor: ew-resize;
      position: relative;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: transparent; }
    input[type="range"]::-moz-range-track { height: 2px; background: transparent; }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--knob);
      margin-top: -7px;
      border: 0;
      box-shadow: 0 0 0 7px var(--paper);
      transition: background .3s;
    }
    input[type="range"]::-moz-range-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--knob);
      border: 0;
      box-shadow: 0 0 0 7px var(--paper);
    }
    input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 6px var(--paper), 0 0 0 7px var(--line); }
    .range-labels { display: flex; align-items: center; justify-content: space-between; margin: -4px 44px 0; }
    .range-labels button {
      border: 0;
      padding: 8px 0;
      background: transparent;
      font-family: var(--serif);
      font-size: 12px;
      letter-spacing: .5px;
      color: var(--muted);
      min-height: 32px;
      transition: color .4s;
    }
    .range-labels button:hover { color: var(--ink); }
    .range-labels button:last-child { font-style: italic; }
    .hint { margin: 24px 0 0; font-size: 10px; letter-spacing: 2px; color: var(--muted); opacity: .8; }
    .hint .arrow { display: inline-block; margin: 0 7px; font-size: 12px; }
    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 68px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 2.8px;
      padding: 10px 20px max(10px, env(safe-area-inset-bottom));
    }
    footer .heart { font-family: Georgia, serif; font-size: 11px; margin: 0 10px; color: #b79185; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes reveal { from { opacity: .2; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (min-height: 950px) { .artwork { width: min(100%, 395px); } .details { margin-top: 26px; } .slider-group { margin-top: 37px; } }
    @media (max-width: 600px) {
      .topbar { height: 76px; padding: 0 25px; }
      .wordmark { font-size: 12px; gap: 9px; letter-spacing: 2px; }
      .wordmark svg { width: 13px; }
      .play-button { min-width: 76px; min-height: 34px; padding: 7px 12px; font-size: 9px; }
      main { min-height: calc(100svh - 132px); padding: 4px 32px 22px; }
      .eyebrow { font-size: 8px; letter-spacing: 3px; margin-bottom: 7px; }
      .artwork { width: min(100%, 322px); }
      .details { margin-top: 13px; min-height: 107px; }
      .price { font-size: 22px; margin-bottom: 10px; }
      .name { font-size: 13px; }
      .description { font-size: 10px; }
      .slider-group { width: 100%; margin-top: 14px; }
      .hint { font-size: 9px; margin-top: 17px; letter-spacing: 1.4px; }
      footer { height: 56px; font-size: 8px; letter-spacing: 2px; }
    }
    @media (max-height: 700px) {
      .topbar { height: 60px; }
      main { min-height: calc(100svh - 104px); padding-top: 3px; padding-bottom: 10px; }
      .artwork { width: min(100%, 42svh, 280px); }
      .details { margin-top: 0; min-height: 90px; }
      .price { font-size: 20px; }
      .slider-group { margin-top: 6px; }
      .hint { margin-top: 12px; }
      footer { height: 44px; }
    }
    @media (max-height: 600px) {
      .artwork { width: min(100%, 38svh, 230px); }
      .details { min-height: 84px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

    const range = document.getElementById("giftRange");
    const rangeWrap = range.parentElement;
    const artwork = document.getElementById("artwork");
    const illustrations = [...document.querySelectorAll(".bracelet")];
    const price = document.getElementById("price");
    const giftName = document.getElementById("giftName");
    const description = document.getElementById("description");
    const hint = document.getElementById("hint");
    const eyebrow = document.getElementById("eyebrow");
    const playButton = document.getElementById("playButton");
    const playLabel = document.getElementById("playLabel");
    const playIcon = document.getElementById("playIcon");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const themeColor = document.querySelector('meta[name="theme-color"]');
    const tierText = document.getElementById("tierText");
    const counter = document.getElementById("counter");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    // 每款均分滑条长度，个位数价位也能轻松选中；保留细分值让滑块跟手。
    const unitsPerGift = 100;
    const maxValue = (gifts.length - 1) * unitsPerGift;
    range.max = maxValue;
    let currentIndex = -1;
    let isPlaying = false;
    let animationFrame = 0;
    let playbackStart = 0;
    let playbackStartValue = 0;
    let activePointer = null;

    function render(value) {
      const amount = Math.max(0, Math.min(maxValue, Number(value) || 0));
      range.value = amount;
      // 仅更新滑条自身，避免每帧让所有手链 SVG 重新计算继承样式。
      rangeWrap.style.setProperty("--progress", `${amount / maxValue * 100}%`);
      const index = Math.round(amount / unitsPerGift);
      if (index === currentIndex) return;

      const previousGift = gifts[currentIndex];
      const gift = gifts[index];
      const isPriceless = index === gifts.length - 1;
      currentIndex = index;

      if (!previousGift || previousGift.art !== gift.art) {
        if (previousGift) {
          illustrations[previousGift.art].classList.remove("active");
          illustrations[previousGift.art].setAttribute("aria-hidden", "true");
        }
        illustrations[gift.art].classList.add("active");
        illustrations[gift.art].setAttribute("aria-hidden", "false");
      }

      document.body.classList.toggle("priceless", isPriceless);
      themeColor.content = isPriceless ? "#0d0d0e" : "#faf9f6";
      price.textContent = gift.price;
      giftName.textContent = gift.name;
      description.textContent = gift.description;
      range.setAttribute("aria-valuetext", `${gift.name}，${gift.description}，${gift.price}`);
      eyebrow.textContent = isPriceless ? "IT WAS ALWAYS YOU" : "A LITTLE SOMETHING FOR YOU";
      hint.textContent = isPriceless
        ? '珍贵的从来都是，送礼物的你。'
        : '拖动或点按滑条 · 也可以逐款切换';
      tierText.textContent = isPriceless ? "心意无价" : gift.amount === 0 ? "亲手做的 · ¥0"
        : gift.amount < 10 ? "个位数 · ¥1—¥9" : gift.amount < 100 ? "十位数 · ¥10—¥99"
        : gift.amount < 1000 ? "百位数 · ¥100—¥999" : gift.amount < 10000 ? "千位数 · ¥1,000—¥9,999" : "万元款 · ¥10,000+";
      counter.textContent = `${String(index + 1).padStart(2, "0")} / ${gifts.length}`;
      previousButton.disabled = index === 0;
      nextButton.disabled = isPriceless;
      updatePlayButton();
    }

    function updatePlayButton() {
      playButton.setAttribute("aria-pressed", String(isPlaying));
      playButton.setAttribute("aria-label", isPlaying ? "暂停手链故事" : "自动播放手链故事");
      playLabel.textContent = isPlaying ? "暂停播放" : currentIndex === gifts.length - 1 ? "再看一次" : "播放故事";
      playIcon.innerHTML = isPlaying
        ? '<path d="M3 2h2v8H3zm4 0h2v8H7Z" fill="currentColor"/>'
        : currentIndex === gifts.length - 1
          ? '<path d="M2 4A4.2 4.2 0 1 1 2.1 8M2 1v3h3" fill="none" stroke="currentColor" stroke-width="1.2"/>'
          : '<path d="M3 1.5 10 6 3 10.5Z" fill="currentColor"/>';
    }

    function stopPlayback() {
      cancelAnimationFrame(animationFrame);
      isPlaying = false;
      updatePlayButton();
    }

    function playFrame(timestamp) {
      if (!isPlaying) return;
      if (!playbackStart) playbackStart = timestamp;
      // 每款约 1.1 秒，开场多停留片刻；暂停后从当前位置继续。
      const value = playbackStartValue + Math.max(0, timestamp - playbackStart - 450) / 11;
      render(value);
      if (value >= maxValue) {
        stopPlayback();
      } else {
        animationFrame = requestAnimationFrame(playFrame);
      }
    }

    function togglePlayback() {
      if (isPlaying) {
        stopPlayback();
        return;
      }
      if (currentIndex === gifts.length - 1) render(0);
      playbackStartValue = Number(range.value);
      playbackStart = 0;
      isPlaying = true;
      updatePlayButton();
      animationFrame = requestAnimationFrame(playFrame);
    }

    range.addEventListener("input", () => { stopPlayback(); render(range.value); });
    function renderPointer(event) {
      const bounds = range.getBoundingClientRect();
      // 与原生滑块的 16px 圆点中心对齐，点按任意位置都会立即响应。
      render((event.clientX - bounds.left - 8) / (bounds.width - 16) * maxValue);
    }
    range.addEventListener("pointerdown", event => {
      if (!event.isPrimary || event.button !== 0) return;
      event.preventDefault();
      stopPlayback();
      activePointer = event.pointerId;
      range.focus({ preventScroll: true });
      range.setPointerCapture(event.pointerId);
      document.body.classList.add("scrubbing");
      renderPointer(event);
    });
    range.addEventListener("pointermove", event => {
      if (event.pointerId === activePointer) renderPointer(event);
    });
    function releasePointer(event) {
      if (event.pointerId !== activePointer) return;
      activePointer = null;
      document.body.classList.remove("scrubbing");
      if (range.hasPointerCapture(event.pointerId)) range.releasePointerCapture(event.pointerId);
    }
    range.addEventListener("pointerup", releasePointer);
    range.addEventListener("pointercancel", releasePointer);
    range.addEventListener("lostpointercapture", releasePointer);
    range.addEventListener("keydown", event => {
      const offsets = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 5, PageDown: -5 };
      if (event.key in offsets || event.key === "Home" || event.key === "End") {
        event.preventDefault();
        stopPlayback();
        render(event.key === "Home" ? 0 : event.key === "End" ? maxValue : (currentIndex + offsets[event.key]) * unitsPerGift);
      }
    });
    playButton.addEventListener("click", togglePlayback);
    previousButton.addEventListener("click", () => { stopPlayback(); render((currentIndex - 1) * unitsPerGift); });
    nextButton.addEventListener("click", () => { stopPlayback(); render((currentIndex + 1) * unitsPerGift); });
    document.getElementById("priceButton").addEventListener("click", () => { stopPlayback(); render(0); });
    document.getElementById("pricelessButton").addEventListener("click", () => { stopPlayback(); render(maxValue); });

    document.addEventListener("visibilitychange", () => { if (document.hidden) stopPlayback(); });
    document.addEventListener("keydown", event => {
      // 原生 range 保留方向键、Home、End 的标准键盘操作。
      if (event.code === "Space" && event.target === document.body) {
        event.preventDefault();
        togglePlayback();
      }
    });

    artwork.addEventListener("pointermove", event => {
      if (event.pointerType !== "mouse" || reducedMotion.matches) return;
      const bounds = artwork.getBoundingClientRect();
      artwork.style.setProperty("--tilt-x", `${-(event.clientY - bounds.top - bounds.height / 2) / 50}deg`);
      artwork.style.setProperty("--tilt-y", `${(event.clientX - bounds.left - bounds.width / 2) / 50}deg`);
    });
    artwork.addEventListener("pointerleave", () => {
      artwork.style.setProperty("--tilt-x", "0deg");
      artwork.style.setProperty("--tilt-y", "0deg");
    });

    render(0);
  </script>
</body>
</html>
